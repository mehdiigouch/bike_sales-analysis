[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bike_sales"
version = "0.0.1"
description = "bike_sales_analysis"
authors = [
  { name = "ELIGGOUCH" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12.0"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "seaborn>=0.13.2",
]


[tool.ruff]
line-length = 99
src = ["bike_sales"]
include = ["pyproject.toml", "bike_sales/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bike_sales"]
force-sort-within-sections = true

